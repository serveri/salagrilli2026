<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #game-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #181822;
      border: 4px solid #343446;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(0, 0, 0, 0.6);
    }

    #canvas-wrapper {
      position: relative;
      width: min(78vw, calc((100vh - 160px) * 720 / 654));
      aspect-ratio: 720 / 654;
      border: 4px solid #141420;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 
        0 0 0 2px #262638,
        0 15px 40px rgba(0, 0, 0, 0.95);
      box-sizing: border-box;
    }

    #canvas-wrapper canvas {
      display: block;
      margin: 0 !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
      border-radius: 6px;
      will-change: opacity;
      transform: translateZ(0);
      background:
        /* Glass Screen Diagonal Sheen Glare */
        linear-gradient(135deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.03) 35%, rgba(0, 0, 0, 0) 65%),
        /* Very Soft Horizontal Scanlines */
        repeating-linear-gradient(to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.06) 2px,
          rgba(0, 0, 0, 0.06) 4px),
        /* Subtle RGB Phosphor Grid */
        repeating-linear-gradient(90deg,
          rgba(255, 0, 0, 0.015) 0px,
          rgba(0, 255, 0, 0.015) 1px,
          rgba(0, 0, 255, 0.015) 2px,
          rgba(0, 0, 0, 0) 3px),
        /* Soft CRT Glass Vignette */
        radial-gradient(ellipse 90% 90% at 50% 50%,
          rgba(0, 0, 0, 0) 65%,
          rgba(0, 0, 0, 0.12) 85%,
          rgba(0, 0, 0, 0.22) 100%);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.25);
      animation: crtLivingBreathe 6.5s ease-in-out infinite alternate;
    }

    /* Balatro-style slow, ambient living phosphor breathing */
    @keyframes crtLivingBreathe {
      0% {
        opacity: 0.68;
      }
      50% {
        opacity: 0.58;
      }
      100% {
        opacity: 0.74;
      }
    }

    #ui-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #energy-bar-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 250px;
      background: #181822;
      padding: 8px 12px;
      border: 4px solid #343446;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    #energy-label {
      font-weight: bold;
      font-size: 16px;
      font-family: 'Pokemon Classic', 'Courier New', monospace;
      color: #fff;
      text-transform: uppercase;
    }

    #energy-bar-bg {
      flex-grow: 1;
      height: 16px;
      background: #0a0a0f;
      border: 2px solid #343446;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    #energy-number {
      position: absolute;
      top: 35%;
      left: 30px;
      transform: translateY(-50%);
      font-family: 'Pokemon Classic', 'Courier New', monospace;
      font-size: 13px;
      color: #fff;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      z-index: 2;
    }

    #energy-bar-fill {
      height: 100%;
      width: 75%;
      /* Default to 150 / 200 energy */
      background: #FFD700;
      /* Yellow flat color */
    }
  </style>
  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Game modules (load order matters: config → systems → scenes → init) -->
  <script src="/puzzle-8/config.js"></script>
  <script src="/puzzle-8/systems/DialogueBox.js"></script>
  <script src="/puzzle-8/systems/Backpack.js"></script>
  <script src="/puzzle-8/scenes/BootScene.js"></script>
  <script src="/puzzle-8/scenes/MenuScene.js"></script>
  <script src="/puzzle-8/scenes/GameScene.js"></script>
  <script src="/puzzle-8/game.js" defer></script>
</head>

<body>
  <div id="ui-wrapper">
    <div id="game-container">
      <div id="canvas-wrapper">
        <div class="crt-overlay"></div>
      </div>
    </div>

    <div id="energy-bar-container">
      <div id="energy-label">Energy</div>
      <div id="energy-bar-bg">
        <div id="energy-bar-fill"></div>
        <div id="energy-number"><span id="energy-val">150</span><span id="energy-lost"
            style="color: #cc0000; display: none; margin-left: 15px; text-shadow: none;"></span></div>
      </div>
    </div>
  </div>

  <script src="/chat-widget.js" data-puzzle="8" data-api-base="https://salagrillitchat.serveriry.fi" defer></script>
</body>

</html>
